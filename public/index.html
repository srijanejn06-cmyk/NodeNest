<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteNest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Notes Manager</p>
          <h1>NoteNest</h1>
        </div>
        <div class="header-badge">Active Notes</div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <div class="panel-header">
            <h2 id="form-title">Add New Note</h2>
          </div>

          <form id="note-form">
            <div class="field-group">
              <label for="title">Note Title</label>
              <input id="title" name="title" type="text" placeholder="Enter note title" required />
            </div>

            <div class="field-group">
              <label for="content">Note Content</label>
              <textarea id="content" name="content" rows="6" placeholder="Write your note here..." required></textarea>
            </div>

            <div class="field-group">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Study">Study</option>
                <option value="Assignment">Assignment</option>
                <option value="Project">Project</option>
                <option value="Personal">Personal</option>
                <option value="Ideas">Ideas</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div id="status-message" class="status-message" aria-live="polite"></div>

            <div class="actions">
              <button type="submit" id="submit-btn" class="primary-btn">Save Note</button>
              <button type="button" id="cancel-btn" class="secondary-btn hidden">Cancel</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="panel-header list-header">
            <h2>All Notes</h2>
            <div class="search-box">
              <input id="search-input" type="search" placeholder="Search notes..." aria-label="Search notes" />
            </div>
          </div>

          <div id="notes-list" class="notes-grid" aria-live="polite"></div>
          <div id="empty-state" class="empty-state hidden">
            No notes available. Create your first note!
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
